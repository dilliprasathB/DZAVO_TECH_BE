# =====================================================
# DZAVO Technology - Spring Boot Configuration
# =====================================================

server.port=${PORT:8080}
server.address=0.0.0.0

spring.application.name=dzavo-backend

# Mail / SMTP Configuration mapped from Environment Variables
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Custom DZAVO Application Properties
dzavo.mail.from=${MAIL_FROM:DZAVO Technology <noreply@dzavo.com>}
dzavo.mail.recipient=${RECIPIENT_EMAIL:dilliprasath1225@gmail.com}
dzavo.cors.allowed-origins=${CORS_ORIGIN:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging configuration
logging.level.com.dzavo=INFO
logging.level.org.springframework.web=WARN
